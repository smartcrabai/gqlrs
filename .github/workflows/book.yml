name: Book

on:
  push:
    branches:
      - release
    paths:
      - "docs/**"

jobs:
  deploy_en:
    name: Deploy book on gh-pages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@adeb05db28a0c0004681db83893d56c0388ea9ea # v1
      - name: Render book
        run: |
          mdbook build -d gh-pages docs/en
          mdbook build -d gh-pages docs/zh-CN
          mkdir gh-pages
          mv docs/en/gh-pages gh-pages/en
          mv docs/zh-CN/gh-pages gh-pages/zh-CN
          mv docs/index.html gh-pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_empty_commit: true
          keep_files: false
          publish_dir: gh-pages
          publish_branch: gh-pages
